# =============================================================================
# Nginx - configuracion base (solo preparacion)
# Reverse proxy hacia el backend Quarkus dentro de la red de Docker Compose.
# Cuando se implemente el frontend web (React/Vite build estatico) este
# archivo se ampliara con la seccion de servido de archivos estaticos.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://backend:6113;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}