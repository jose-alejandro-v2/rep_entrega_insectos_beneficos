# =============================================================================
# Sistema de Control de Entrega de Insectos Beneficos - Backend Quarkus
# Perfil DEV (default en este HITO). Credenciales de BD = docker-compose.yml raiz.
# Seguridad: clave JWT de desarrollo en dev-jwt-key.jwk (NO usar en produccion).
# =============================================================================

# --- Servidor HTTP ---
quarkus.http.port=6101
quarkus.http.host=0.0.0.0

# --- Datasource PostgreSQL 16 (Docker) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/insectos_beneficos
quarkus.datasource.username=insectos_dev
quarkus.datasource.password=insectos_dev_password_2026
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10

# --- Hibernate ORM ---
# El esquema lo crea Flyway; Hibernate NO genera ni valida tablas.
quarkus.hibernate-orm.database.generation=none
# Naming snake_case: contrasenaHash -> contrasena_hash (columnas de la migracion V1)
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.log.sql=false

# --- Flyway ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=false

# --- CORS (solo desarrollo; cualquier origen permitido para el cliente movil RN) ---
# Desde Quarkus 3.4 el filtro se habilita con quarkus.http.cors.enabled
# (ver guia security-cors); origen "*" se expresa como regex /.*/.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
# Metodos/headers requeridos por React Native (mobile)
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Authorization
quarkus.http.cors.access-control-max-age=24H

# --- JWT (SmallRye JWT Build -> firma, SmallRye JWT verify -> validacion) ---
# Issuer compartido entre generacion y verificacion (mp.jwt.verify.issuer).
smallrye.jwt.new-token.issuer=insectos-beneficos-dev
smallrye.jwt.new-token.signature-algorithm=HS256
# Vida del token: 8 horas (28800 segundos).
smallrye.jwt.new-token.lifespan=28800
# Clave HMAC compartida (archivo JWK "oct"); solo dev.
# ADVERTENCIA DE SEGURIDAD: en produccion debe venir de secret manager / env var
# (smallrye.jwt.sign.key / smallrye.jwt.verify.secretkey con valor externo).
smallrye.jwt.sign.key.location=dev-jwt-key.jwk
# Verificacion HS256: la guia oficial de Quarkus exige smallrye.jwt.verify.*
# para claves simetricas (mp.jwt.verify.publickey.location NO resuelve JWK "oct":
# ver smallrye-jwt issue #817 / SRJWT07004).
smallrye.jwt.verify.key.location=dev-jwt-key.jwk
smallrye.jwt.verify.algorithm=HS256
mp.jwt.verify.issuer=insectos-beneficos-dev
mp.jwt.verify.audiences=
# Los roles vienen del claim "groups" (perfil del usuario) que firma el servidor.
mp.jwt.verify.claims.groups.name=groups

# --- OpenAPI / Swagger UI (ADR-A003 D-AUTH2-5; resuelve deuda H5) ---
# Rutas por defecto: /q/openapi (esquema) y /q/swagger-ui (UI en dev y jar).
quarkus.swagger-ui.always-include=true

# --- Logs ---
quarkus.log.level=INFO
quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."org.flywaydb".level=INFO

# --- Test Profile Port ---
quarkus.http.test-port=8083

# =============================================================================
# Mailer SMTP (HITO-018 - notificaciones por correo)
# =============================================================================
# Credenciales SOLO por env (`QUARKUS_MAILER_*`), nunca hardcodeadas (H10).
# Quarkus mapea solas estas env vars a quarkus.mailer.* (host/port/username/
# password/from/start-tls) — NO se declaran aqui para que, en dev SIN env, el
# Dev Services levante Mailpit automatico (correos en http://localhost:8025) y
# en tests aplique `%test.quarkus.mailer.mock` (MockMailbox sin SMTP).
# Config del relay interno Exchange (SRVICDCPRI.vanguardfresh.pe) documentada en
# docker-compose.yml (validado 2026-09-16: puerto 25 sin TLS, sin AUTH):
#   QUARKUS_MAILER_HOST=10.13.10.10
#   QUARKUS_MAILER_PORT=25        (SMTP plano, sin STARTTLS)
#   QUARKUS_MAILER_USERNAME=      (vacío — el relay no requiere autenticación)
#   QUARKUS_MAILER_PASSWORD=      (vacío)
#   QUARKUS_MAILER_FROM=notificaciones.noreply@vanguardfresh.com
#   QUARKUS_MAILER_START_TLS=DISABLED
quarkus.mailer.from=${QUARKUS_MAILER_FROM:notificaciones@insectosbeneficios.local}

# Tests: MockMailbox (quarkus.mailer.mock) — sin SMTP real ni Mailpit.
%test.quarkus.mailer.mock=true

