# Sistema de Control de Registro de Insectos Beneficos (entrega)
# Infraestructura local de desarrollo. Backend Quarkus + PostgreSQL 16 + Nginx
# todo dentro de Docker. Credenciales de DEV documentadas en
# backend/src/main/resources/application.properties.
name: repo_registro_insectos_beneficos

services:
  postgres:
    image: postgres:16
    container_name: repo_registro_insectos_beneficos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: insectos_beneficos
      POSTGRES_USER: insectos_dev
      POSTGRES_PASSWORD: insectos_dev_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insectos_dev -d insectos_beneficos"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: repo_registro_insectos_beneficos-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: America/Lima
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/insectos_beneficos
      QUARKUS_DATASOURCE_USERNAME: insectos_dev
      QUARKUS_DATASOURCE_PASSWORD: insectos_dev_password_2026
      # Mailer SMTP (HITO-018): relay interno Exchange (SRVICDCPRI.vanguardfresh.pe).
      # El container Docker bridge alcanza 10.13.10.10:25 directamente por
      # ruteo del host — no requiere proxy intermediario ni extra_hosts.
      QUARKUS_MAILER_HOST: ${QUARKUS_MAILER_HOST:-10.13.10.10}
      QUARKUS_MAILER_PORT: ${QUARKUS_MAILER_PORT:-25}
      QUARKUS_MAILER_START_TLS: ${QUARKUS_MAILER_START_TLS:-DISABLED}
      QUARKUS_MAILER_USERNAME: ${QUARKUS_MAILER_USERNAME:-}
      QUARKUS_MAILER_PASSWORD: ${QUARKUS_MAILER_PASSWORD:-}
      QUARKUS_MAILER_FROM: ${QUARKUS_MAILER_FROM:-notificaciones.noreply@vanguardfresh.com}
      # Firebase FCM (ADR-A004: notificaciones push).
      GOOGLE_FIREBASE_CREDENTIALS: ${GOOGLE_FIREBASE_CREDENTIALS:-/app/firebase-service-account.json}
    ports:
      - "6101:6101"
    volumes:
      - uploads_data:/app/uploads
      # Service account Firebase (NUNCA se versiona: _firebase/ está en .gitignore).
      - ./_firebase/apkinsectosbeneficos-firebase-adminsdk-fbsvc-768d2ba7d3.json:/app/firebase-service-account.json:ro

  nginx:
    image: nginx:1.27-alpine
    container_name: repo_registro_insectos_beneficos-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pg_data:
  uploads_data: